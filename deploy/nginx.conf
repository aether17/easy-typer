server {
    listen 80;
    server_name _;
    root /site/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /practice-texts/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ~* \.(?:js|css|woff2?|ttf|png|ico|svg)$ {
        expires 1d;
        try_files $uri =404;
    }
    # Vue Router history URLs must also work on refresh/direct navigation.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
